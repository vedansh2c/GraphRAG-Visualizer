spring.application.name=GraphRAG Explorer
server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:40MB}
server.error.include-message=never
explorer.store=${STORE:neo4j}
explorer.data-dir=${DATA_DIR:.data}
explorer.neo4j-uri=${NEO4J_URI:bolt://localhost:7687}
explorer.neo4j-user=${NEO4J_USER:neo4j}
explorer.neo4j-password=${NEO4J_PASSWORD:explorer-local-password}
explorer.neo4j-database=${NEO4J_DATABASE:neo4j}
explorer.community-detector=${COMMUNITY_DETECTOR:gds}
explorer.api-key=${MODEL_API_KEY:}
explorer.base-url=${MODEL_BASE_URL:https://api.openai.com/v1}
explorer.chat-model=${CHAT_MODEL:gpt-4.1-mini}
explorer.embedding-model=${EMBEDDING_MODEL:text-embedding-3-small}
explorer.model-timeout=${MODEL_TIMEOUT:90}
explorer.max-files=${MAX_FILES:20}
explorer.max-total-bytes=${MAX_TOTAL_BYTES:40000000}
explorer.passage-size=${PASSAGE_SIZE:6000}
explorer.overlap=${PASSAGE_OVERLAP:600}
explorer.chunk-size=${CHUNK_SIZE:500}
explorer.seeds=${SEED_LIMIT:3}
explorer.relationships=${RELATIONSHIP_LIMIT:10}
explorer.passages=${PASSAGE_LIMIT:5}
explorer.communities=${COMMUNITY_LIMIT:3}
explorer.passages-per-community=${PASSAGES_PER_COMMUNITY:2}
explorer.followups=${FOLLOWUP_LIMIT:3}
explorer.vector-context=${VECTOR_CONTEXT:5}
explorer.vector-inspect=${VECTOR_INSPECT:12}
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.neo4j.Neo4jAutoConfiguration
logging.level.root=INFO
logging.level.org.springframework=INFO
