services:
  neo4j:
    build:
      context: .
      dockerfile: Dockerfile.neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-explorer-local-password}
      NEO4J_dbms_security_procedures_unrestricted: gds.*
      NEO4J_dbms_security_procedures_allowlist: gds.*
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
  app:
    build: .
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      STORE: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-explorer-local-password}
      NEO4J_DATABASE: neo4j
      COMMUNITY_DETECTOR: ${COMMUNITY_DETECTOR:-gds}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.openai.com/v1}
      CHAT_MODEL: ${CHAT_MODEL:-gpt-4.1-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      MODEL_TIMEOUT: ${MODEL_TIMEOUT:-90}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10MB}
      MAX_REQUEST_SIZE: ${MAX_REQUEST_SIZE:-40MB}
      MAX_FILES: ${MAX_FILES:-20}
      MAX_TOTAL_BYTES: ${MAX_TOTAL_BYTES:-40000000}
      PASSAGE_SIZE: ${PASSAGE_SIZE:-6000}
      PASSAGE_OVERLAP: ${PASSAGE_OVERLAP:-600}
      CHUNK_SIZE: ${CHUNK_SIZE:-500}
      SEED_LIMIT: ${SEED_LIMIT:-3}
      RELATIONSHIP_LIMIT: ${RELATIONSHIP_LIMIT:-10}
      PASSAGE_LIMIT: ${PASSAGE_LIMIT:-5}
      COMMUNITY_LIMIT: ${COMMUNITY_LIMIT:-3}
      PASSAGES_PER_COMMUNITY: ${PASSAGES_PER_COMMUNITY:-2}
      FOLLOWUP_LIMIT: ${FOLLOWUP_LIMIT:-3}
      VECTOR_CONTEXT: ${VECTOR_CONTEXT:-5}
      VECTOR_INSPECT: ${VECTOR_INSPECT:-12}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
volumes:
  neo4j-data:
